name: bake-emb3582-tv-v3

on:
  workflow_dispatch:
  push:
    branches: [emb3582]
    paths:
      - '.github/workflows/bake-emb3582-tv-v3.yml'

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download v3 bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work
          cd work
          gh release download emb3582-tv-v3 -R "$GITHUB_REPOSITORY" \
            -p 'tv-v3-bundle.tar.gz' -p 'SHA256SUMS-tv-v3.txt'
          sha256sum -c SHA256SUMS-tv-v3.txt
          tar xzf tv-v3-bundle.tar.gz
          rm -f tv-v3-bundle.tar.gz SHA256SUMS-tv-v3.txt
      - name: Install e2fsprogs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends e2fsprogs
      - name: Edit v1 slices in place
        run: |
          set -o pipefail
          cd work
          bash edit_v3.sh 2>&1 | tee edit.log
      - name: Pack v3 slices
        run: |
          set -euo pipefail
          cd work
          tar czf tv-v3-baked.tar.gz system.img vendor.img edit.log
          ls -lh tv-v3-baked.tar.gz
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload emb3582-tv-v3 work/tv-v3-baked.tar.gz -R "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: emb3582-tv-v3-baked
          path: work/tv-v3-baked.tar.gz
          if-no-files-found: error
          retention-days: 7