name: bake-emb3582-ext4

# Offline ext4 edits for the EMB-3582 super slices using e2fsprogs debugfs.
# The bundle (vendor.img / vendor_dlkm.img / product.img + payload + edit
# script) is attached to the "bake-bundle-v1" release of this repository.

on:
  workflow_dispatch:
  push:
    branches: [emb3582]
    paths:
      - '.github/workflows/bake-emb3582-ext4.yml'

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: fetch bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release download bake-bundle-v1 -R "$GITHUB_REPOSITORY" -p 'bake_bundle.tar.gz' -O bundle.tar.gz
          ls -l bundle.tar.gz
          tar xzf bundle.tar.gz
          ls -l

      - name: deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends e2fsprogs

      - name: patch edit script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('edit_ext4.sh')
          s = p.read_text()
          needle = 'for m in rtl8188fu snd-soc-es8328 snd-soc-es8328-i2c r8168; do\n'
          patch = 'rm -f /tmp/vd/lib/modules/rtl8812au.ko /tmp/vd/lib/modules/rtl8851bu.ko\n'
          if patch not in s:
              s = s.replace(needle, patch + needle)
          s = s.replace(
              '    local img=$1 path=$2 mode=$3 tmp=/tmp/$(basename "$path").$$\n',
              '    local img=$1 path=$2 mode=$3\n    local tmp="/tmp/$(basename "$path").$$"\n')
          s = s.replace('S=system.img\n', 'S=system.img\nSYS_PROP=/system/build.prop\nhas_file "$S" "$SYS_PROP" || SYS_PROP=/build.prop\n', 1)
          before, rest = s.split('S=system.img\n', 1)
          rest = rest.replace('rewrite_prop "$S" /build.prop 0100644', 'rewrite_prop "$S" "$SYS_PROP" 0100644')
          rest = rest.replace('if has_file "$S" /build.prop; then', 'if has_file "$S" "$SYS_PROP"; then')
          rest = rest.replace('debugfs -R "dump /build.prop /tmp/system.build.prop" "$S"', 'debugfs -R "dump $SYS_PROP /tmp/system.build.prop" "$S"')
          rest = rest.replace('debugfs -w -R "rm /build.prop" "$S"', 'debugfs -w -R "rm $SYS_PROP" "$S"')
          rest = rest.replace('debugfs -w -R "write /tmp/system.build.prop /build.prop" "$S"', 'debugfs -w -R "write /tmp/system.build.prop $SYS_PROP" "$S"')
          rest = rest.replace('debugfs -w -R "sif /build.prop mode 0100644" "$S"', 'debugfs -w -R "sif $SYS_PROP mode 0100644" "$S"')
          rest = rest.replace('debugfs -R "dump /build.prop /tmp/s2.prop" system.img', 'debugfs -R "dump $SYS_PROP /tmp/s2.prop" system.img')
          p.write_text(before + 'S=system.img\n' + rest)
          PY

      - name: edit slices
        run: |
          set -o pipefail
          sudo bash edit_ext4.sh 2>&1 | tee edit.log

      - name: pack results
        run: |
          set -e
          tar czf results.tar.gz system.img edit.log
          ls -l results.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: baked-slices
          path: results.tar.gz
          if-no-files-found: error

      - name: publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload bake-bundle-v1 results.tar.gz -R "$GITHUB_REPOSITORY" --clobber